allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.annotation' && details.requested.name.startsWith('annotation')) {
                details.useVersion '1.8.2'
            }
            if (details.requested.group == 'androidx.core' && details.requested.name.startsWith('core')) {
                details.useVersion '1.13.1'
            }
            if (details.requested.group == 'androidx.lifecycle') {
                details.useVersion '2.7.0'
            }
        }
    }
}
