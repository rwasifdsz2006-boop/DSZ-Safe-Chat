plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.aistudio.dszsavechat.app"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.aistudio.dszsavechat.app"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.annotation:annotation:1.8.2'
        force 'androidx.annotation:annotation-jvm:1.8.2'
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.fragment:fragment:1.8.2'
        force 'androidx.activity:activity:1.9.1'
        force 'androidx.window:window:1.2.0'
        force 'androidx.window:window-java:1.2.0'
        force 'androidx.lifecycle:lifecycle-common:2.7.0'
        force 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
        force 'androidx.lifecycle:lifecycle-runtime:2.7.0'
        force 'androidx.lifecycle:lifecycle-process:2.7.0'
        force 'androidx.lifecycle:lifecycle-livedata:2.7.0'
        force 'androidx.lifecycle:lifecycle-livedata-core:2.7.0'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
        force 'androidx.exifinterface:exifinterface:1.3.6'
    }
}

dependencies {}
