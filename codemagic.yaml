workflows:
  android-release:
    name: DSZ Safe Chat Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-pub
    artifacts:
      - build/**/outputs/**/*.apk
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
