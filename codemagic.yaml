workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android App
        script: |
          pkill -9 -f gradle || true
          rm -rf ~/.gradle/caches/
          
          # Root aur app folder dono mein debug keystore generate kar ke rakh do taake key ka masla kabhi na aaye
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
          mkdir -p app
          cp debug.keystore app/debug.keystore || true

          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
