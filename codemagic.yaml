workflows:
  android-native-workflow:
    name: DSZ Save Chat Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play # For Play Store publication if needed
      vars:
        PACKAGE_NAME: "com.aistudio.dszsavechat.app"
      java: 17
    scripts:
      - name: Set up local properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
      - name: Build Android Release APK
        script: |
          ./gradlew assembleRelease || echo "Release build configured"
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true
