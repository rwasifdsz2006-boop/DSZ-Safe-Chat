workflows:
  android-release:
    name: DSZ Safe Chat Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
         flutter clean
         flutter pub get
         cd android
         ./gradlew clean
         cd ..
         flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
      - "**/*.apk"
