workflows:
  android-release:
    name: DSZ Safe Chat Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fetch and Clean
        script: |
          chmod +x android/gradlew 2>/dev/null || true
          flutter clean
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
      - "**/*.apk"
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true
