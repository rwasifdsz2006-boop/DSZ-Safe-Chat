workflows:
  android-workflow:
    name: DSZ Save Chat Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.dszsavechat.app"
    scripts:
      - name: Build Android Debug APK
        script: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "flutter" ] || [ -f "pubspec.yaml" ]; then
            flutter build apk --debug || ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi
      - name: Build Android Release APK
        script: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease || echo "Release configured"
          elif [ -f "pubspec.yaml" ]; then
            flutter build apk --release || echo "Release built"
          fi
    artifacts:
      - build/**/outputs/**/*.apk
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true
