workflows:
  android-workflow:
    name: DSZ Save Chat Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.dszsavechat.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Set up Android environment
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties" || true
      - name: Get packages
        script: |
          flutter pub get || true
      - name: Build Android APK
        script: |
          flutter build apk --release || flutter build apk --debug || (chmod +x gradlew && ./gradlew assembleRelease) || (chmod +x gradlew && ./gradlew assembleDebug)
    artifacts:
      - build/**/outputs/**/*.apk
      - app/build/outputs/**/*.apk
      - build/app/outputs/flutter-apk/*.apk
      - "**/*.apk"
      - "**/*.aab"
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true

