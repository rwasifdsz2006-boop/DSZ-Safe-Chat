workflows:
  flutter-android-workflow:
    name: DSZ Save Chat Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.dszsavechat.app"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get || echo "Packages resolved"
      - name: Build Android Release APK
        script: |
          flutter build apk --release || flutter build apk --debug || (chmod +x gradlew && ./gradlew assembleRelease) || (chmod +x gradlew && ./gradlew assembleDebug)
    artifacts:
      - build/**/outputs/**/*.apk
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - "**/*.apk"
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true
