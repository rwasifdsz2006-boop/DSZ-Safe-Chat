workflows:
  android-release:
    name: DSZ Save Chat Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Force Java 17 and Clean Gradle Cache
        script: |
          export JAVA_HOME="/usr/lib/jvm/java-1.17.0-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
      - name: Set up Android environment
        script: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/app/outputs/flutter-apk/*.apk
      - "**/*.apk"
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true
