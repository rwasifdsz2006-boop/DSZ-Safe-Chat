workflows:
  android-release:
    name: DSZ Save Chat Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Force Gradle 8.10 Version
        script: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/distributionUrl=.*\/gradle-.*-bin.zip/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.10-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Set up Android environment
        script: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/app/outputs/flutter-apk/*.apk
      - "**/*.apk"
    publishing:
      email:
        recipients:
          - rwasifdsz.2006@gmail.com
        notify:
          success: true
          failure: true
